name: Relógio (entrada e saída com hora marcada)

# A cada 10 minutos, dia e noite: posts que você agendou no painel entram,
# e os que têm hora de sair do ar são apagados. Rápido: não abre navegador.
# (O GitHub às vezes atrasa alguns minutos as rodadas marcadas.)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: robo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  relogio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-nuvem.txt
      - run: pip install -r requirements-nuvem.txt
      - name: Entradas e saídas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PYTHONUTF8: "1"
        run: python nuvem.py relogio
      - name: Guardar a fila e o estado
        if: always()
        run: |
          git config user.name "robo-nuvem"
          git config user.email "robo-nuvem@users.noreply.github.com"
          for f in robo.db estado.json; do [ -e "$f" ] && git add -A "$f"; done
          git diff --cached --quiet || git commit -m "robô: relógio $(date -u +%F' '%H:%M)"
          git pull --rebase -X theirs || true
          git push
