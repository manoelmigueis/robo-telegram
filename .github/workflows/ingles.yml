name: Canal de inglês

on:
  schedule:
    # Roda de hora em hora (das 09h às 21h de Manaus). O ingles.py só posta quando um
    # horário da grade (09h, 13h, 19h) venceu sem post: se o GitHub atrasar ou pular uma
    # rodada, o post sai na rodada seguinte. Minuto 23 evita o pico da hora cheia.
    - cron: "23 13-23,0-1 * * *"
  workflow_dispatch:

concurrency:
  group: ingles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-nuvem.txt
      - run: pip install -r requirements-nuvem.txt
      - name: Postar o próximo post de inglês
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PYTHONUTF8: "1"
        # Na mão (Run workflow) posta na hora; no agendamento, só se um horário venceu.
        run: python ingles.py ${{ github.event_name == 'schedule' && 'agendado' || 'proximo' }}
      - name: Guardar o estado
        run: |
          git config user.name "robo-nuvem"
          git config user.email "robo-nuvem@users.noreply.github.com"
          git add ingles/estado.json
          git diff --cached --quiet || git commit -m "inglês: post $(date -u +%F' '%H:%M)"
          git pull --rebase -X theirs || true
          git push
