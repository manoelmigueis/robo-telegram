name: Canal de inglês

on:
  schedule:
    # 09h, 13h e 19h no horário de Manaus (UTC-4) = 13h, 17h e 23h UTC
    - cron: "0 13,17,23 * * *"
  workflow_dispatch:

concurrency:
  group: ingles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-nuvem.txt
      - run: pip install -r requirements-nuvem.txt
      - name: Postar o próximo post de inglês
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PYTHONUTF8: "1"
        run: python ingles.py proximo
      - name: Guardar o estado
        run: |
          git config user.name "robo-nuvem"
          git config user.email "robo-nuvem@users.noreply.github.com"
          git add ingles/estado.json
          git diff --cached --quiet || git commit -m "inglês: post $(date -u +%F' '%H:%M)"
          git pull --rebase -X theirs || true
          git push
