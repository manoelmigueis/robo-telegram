name: Canal de achadinhos casa e cozinha

on:
  schedule:
    # Roda de hora em hora (das 09h às 21h de Manaus). O achadinhos.py só posta quando um
    # horário (09h, 12h, 15h, 18h, 21h) venceu sem post. Minuto 53 evita o pico da hora cheia.
    - cron: "53 13-23,0-1 * * *"
  workflow_dispatch:
    inputs:
      vigia:
        description: "Deixe em branco para postar agora (o vigia usa 1 = rodada marcada)"
        required: false
        default: ""

concurrency:
  group: achadinhos
  cancel-in-progress: false

permissions:
  models: read
  contents: write

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-nuvem.txt
      - run: pip install -r requirements-nuvem.txt
      - name: Postar uma oferta de casa e cozinha da Amazon
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: "1"
        # Na mão (Run workflow) posta na hora; no agendamento, só se um horário venceu.
        run: python achadinhos.py ${{ (github.event_name == 'schedule' || inputs.vigia) && 'agendado' || 'agora' }}
      - name: Guardar o estado
        run: |
          git config user.name "robo-nuvem"
          git config user.email "robo-nuvem@users.noreply.github.com"
          git add achadinhos/estado.json
          git diff --cached --quiet || git commit -m "achadinhos: post $(date -u +%F' '%H:%M)"
          git pull --rebase -X theirs || true
          git push
